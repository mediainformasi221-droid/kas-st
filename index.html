    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#334e68',
                            800: '#102a43',
                            900: '#0b1b2b',
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',

                        }

    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col text-slate-800">

    <!-- APP CONTAINER -->
    <div id="app" class="flex flex-col min-h-screen">
        <!-- Auth Screen / Rendered Dynamically -->
    </div>

    <!-- MODALS CONTAINER -->
    <div id="modal-container"></div>

    <!-- APPLICATION SCRIPT -->
    <script>

        // ==========================================
        // STATE MANAGEMENT & INITIAL DATA
        // ==========================================
        const DEFAULT_STATE = {

            pegawaiList: [

                "Ahmad Dahlan",

                "Eko Prasetyo"
            ],
            settings: {
                tarifLuarKota: 20000,
                tarifDalamKota: 10000,
                effectiveDate: new Date().toISOString().split('T')[0],
                briAccountName: "BENDAHARA KAS ST",
                briAccountNumber: "5829-01-002849-53-1",
                briBankName: "BANK RAKYAT INDONESIA (BRI)",
                qrisMerchant: "KAS OPERASIONAL SURAT TUGAS",
                qrisImageUrl: "https://placehold.co/300x300/102a43/ffffff?text=QRIS+KAS-ST"
            },
            suratTugas: [
                { id: "ST-2026-001", nomor: "ST/102/I/2026", pelaksana: "Budi Santoso", tanggal: "2026-01-10", pelaksanaan: "2026-01-12", uraian: "Pemeriksaan Lapangan Lapangan A", jenis: "Luar Kota", tarif: 20000, alokasi: 20000, metode: "BRI", ref: "TRX-88201", status: "Sudah Dibayar", lampiran: "st102.pdf" },
                { id: "ST-2026-002", nomor: "ST/105/I/2026", pelaksana: "Siti Rahma", tanggal: "2026-01-14", pelaksanaan: "2026-01-15", uraian: "Koordinasi Wilayah Dalam Kota", jenis: "Dalam Kota", tarif: 10000, alokasi: 10000, metode: "QRIS", ref: "QR-90112", status: "Sudah Dibayar", lampiran: null },
                { id: "ST-2026-003", nomor: "ST/108/I/2026", pelaksana: "Ahmad Dahlan", tanggal: "2026-01-20", pelaksanaan: "2026-01-22", uraian: "Supervisi Proyek Daerah B", jenis: "Luar Kota", tarif: 20000, alokasi: 20000, metode: "BRI", ref: "TRX-88390", status: "Sudah Dibayar", lampiran: "st108.pdf" },
                { id: "ST-2026-004", nomor: "ST/112/I/2026", pelaksana: "Rudi Hermawan", tanggal: "2026-01-25", pelaksanaan: "2026-01-26", uraian: "Rapat Koordinasi Balai Kota", jenis: "Dalam Kota", tarif: 10000, alokasi: 10000, metode: "BRI", ref: "TRX-88410", status: "Menunggu Verifikasi Admin", lampiran: null }
            ],
            transactions: [
                { id: "TRX-001", tanggal: "2026-01-12", stNomor: "ST/102/I/2026", jenis: "Penerimaan", kategori: "Alokasi ST Luar Kota", uraian: "Pencairan Kas ST/102/I/2026", masuk: 20000, keluar: 0, metode: "BRI", ref: "TRX-88201", status: "Sah", pencatat: "Admin Kas", validator: "Bendahara Utama" },
                { id: "TRX-002", tanggal: "2026-01-15", stNomor: "ST/105/I/2026", jenis: "Penerimaan", kategori: "Alokasi ST Dalam Kota", uraian: "Pencairan Kas ST/105/I/2026", masuk: 10000, keluar: 0, metode: "QRIS", ref: "QR-90112", status: "Sah", pencatat: "Admin Kas", validator: "Bendahara Utama" },
                { id: "TRX-003", tanggal: "2026-01-18", stNomor: "-", jenis: "Pengeluaran", kategori: "Konsumsi & Operasional", uraian: "Pembelian ATK dan Konsumsi Rapat ST", masuk: 0, keluar: 12000, metode: "Cash", ref: "KW-001", status: "Sah", pencatat: "Admin Kas", validator: "Bendahara Utama" },
                { id: "TRX-004", tanggal: "2026-01-22", stNomor: "ST/108/I/2026", jenis: "Penerimaan", kategori: "Alokasi ST Luar Kota", uraian: "Pencairan Kas ST/108/I/2026", masuk: 20000, keluar: 0, metode: "BRI", ref: "TRX-88390", status: "Sah", pencatat: "Admin Kas", validator: "Bendahara Utama" },
                { id: "TRX-005", tanggal: "2026-01-28", stNomor: "-", jenis: "Penerimaan", kategori: "Alokasi ST Luar Kota", uraian: "Setoran Kas ST/115/I/2026", masuk: 20000, keluar: 0, metode: "BRI", ref: "TRX-99011", status: "Menunggu Verifikasi", pencatat: "Staf ST", validator: "-" }
            ],
            reconciliations: [
                { id: "REC-001", tanggal: "2026-01-31", saldoAplikasi: 38000, saldoAktual: 38000, selisih: 0, petugas: "Admin Kas", catatan: "Sesuai dengan mutasi rekening BRI dan QRIS", status: "Match" }
            ],
            auditLogs: [
                { id: "LOG-001", timestamp: "2026-01-10 09:00", user: "System", action: "Inisialisasi Sistem", detail: "Aplikasi KAS-ST dimulai dengan tarif dasar Rp20k/10k." },
                { id: "LOG-002", timestamp: "2026-01-12 10:15", user: "Admin Kas", action: "Validasi Transaksi", detail: "Mengesahkan TRX-001 nominal Rp20.000" }
            ],
            activeView: 'dashboard'
        };

        let state = JSON.parse(localStorage.getItem('KAS_ST_APP_STATE')) || DEFAULT_STATE;
        
        if (!state.pegawaiList) {
            state.pegawaiList = ["Budi Santoso", "Siti Rahma", "Ahmad Dahlan", "Rudi Hermawan", "Dewi Lestari"];
        }

        function saveState() {
            localStorage.setItem('KAS_ST_APP_STATE', JSON.stringify(state));
            renderApp();
        }

        // ==========================================
        // SYNC DENGAN GOOGLE SHEETS VIA WEB APP
        // ==========================================
        function syncToGoogleSheets(payload) {
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                console.log("Data berhasil disinkronkan ke Google Spreadsheet.");
            })
            .catch(error => {
                console.error("Gagal sinkronisasi ke spreadsheet:", error);
            });
        }

        function logAudit(action, detail) {
            const newLog = {
                id: `LOG-${Date.now()}`,
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser ? `${state.currentUser.name} (${state.currentUser.role})` : 'Sistem',
                action: action,
                detail: detail
            };
            state.auditLogs.unshift(newLog);
        }

        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar) sidebar.classList.toggle('-translate-x-full');
            if (overlay) overlay.classList.toggle('hidden');
        }

        function calculateFinancials() {
            const validTransactions = state.transactions.filter(t => t.status === 'Sah');
            const totalPenerimaan = validTransactions.reduce((acc, t) => acc + (t.masuk || 0), 0);
            const totalPengeluaran = validTransactions.reduce((acc, t) => acc + (t.keluar || 0), 0);
            const saldoKas = totalPenerimaan - totalPengeluaran;

            const stDalamKotaCount = state.suratTugas.filter(s => s.jenis === 'Dalam Kota').length;
            const stLuarKotaCount = state.suratTugas.filter(s => s.jenis === 'Luar Kota').length;
            const totalAlokasiST = state.suratTugas.reduce((acc, s) => acc + (s.alokasi || 0), 0);
            const pendingTxCount = state.transactions.filter(t => t.status === 'Menunggu Verifikasi').length;

            return { saldoKas, totalPenerimaan, totalPengeluaran, stDalamKotaCount, stLuarKotaCount, totalAlokasiST, pendingTxCount };
        }

        function renderApp() {
            const appEl = document.getElementById('app');
            
            if (!state.currentUser) {
                appEl.innerHTML = renderLoginScreen();
                if (window.lucide) lucide.createIcons();
                return;
            }

            appEl.innerHTML = `
                <div class="flex h-screen overflow-hidden bg-slate-100 relative">
                    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>
                    ${renderSidebar()}
                    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                        ${renderNavbar()}
                        <main class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50">
                            ${renderMainView()}
                        </main>
                    </div>
                </div>
            `;

            if (window.lucide) lucide.createIcons();
            initChartsIfNeeded();
        }

        function renderLoginScreen() {
            return `
                <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-navy-900 via-slate-900 to-navy-800 opacity-90"></div>
                    <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
                        <div class="bg-navy-900 p-6 text-center text-white border-b border-gold-500/30">
                            <div class="inline-flex p-3 bg-gold-500/10 rounded-full mb-3 text-gold-400">
                                <i data-lucide="wallet" class="w-10 h-10"></i>
                            </div>
                            <h1 class="text-xl font-bold tracking-wide">SISTEM KAS-ST</h1>
                            <p class="text-xs text-slate-300 mt-1">Sistem Informasi Kas Hasil Surat Tugas & Database Sheet</p>
                        </div>
                        <div class="p-6">
                            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email / Username</label>
                                    <input type="text" id="login-email" value="admin@kasst.go.id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-navy-500 focus:outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                                    <input type="password" id="login-password" value="password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-navy-500 focus:outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Peran Akses (Role)</label>
                                    <select id="login-role" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-navy-500 focus:outline-none text-sm bg-white">
                                        <option value="admin">Administrator (Akses Penuh)</option>
                                        <option value="viewer">Viewer (Pemantau Dashboard)</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full py-2.5 bg-navy-800 hover:bg-navy-900 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm flex items-center justify-center gap-2">
                                    <i data-lucide="log-in" class="w-4 h-4"></i> Masuk ke Sistem
                                </button>
                            </form>
                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <p class="text-xs text-slate-500 text-center mb-2">Login Cepat (Uji Coba):</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="quickLogin('admin')" class="py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg font-medium border border-slate-300">👑 Role Admin</button>
                                    <button onclick="quickLogin('viewer')" class="py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg font-medium border border-slate-300">👁️ Role Viewer</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('login-role').value;
            const email = document.getElementById('login-email').value;
            state.currentUser = { name: role === 'admin' ? 'Administrator Kas' : 'Pemantau Publik', role, email };
            logAudit("Login", `Pengguna ${state.currentUser.name} login sebagai ${role}`);
            saveState();
        }

        function quickLogin(role) {
            state.currentUser = { name: role === 'admin' ? 'Administrator Kas' : 'Auditor Viewer', role, email: `${role}@kasst.go.id` };
            logAudit("Login Cepat", `Pengguna login cepat sebagai ${role}`);
            saveState();
        }

        function handleLogout() {
            logAudit("Logout", `Pengguna ${state.currentUser.name} keluar`);
            state.currentUser = null;
            state.activeView = 'dashboard';
            saveState();
        }

        function renderSidebar() {
            const isAdmin = state.currentUser.role === 'admin';
            const adminMenus = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'master-st', label: 'Master Surat Tugas', icon: 'file-text' },
                { id: 'master-pegawai', label: 'Kelola Pegawai', icon: 'users' },
                { id: 'penerimaan', label: 'Penerimaan Kas', icon: 'arrow-down-left' },
                { id: 'pengeluaran', label: 'Pengeluaran Kas', icon: 'arrow-up-right' },
                { id: 'buku-kas', label: 'Buku Kas', icon: 'book-open' },
                { id: 'rekonsiliasi', label: 'Rekonsiliasi Kas', icon: 'scale' },
                { id: 'laporan', label: 'Laporan Keuangan', icon: 'bar-chart-3' },
                { id: 'pengaturan-tarif', label: 'Pengaturan Tarif ST', icon: 'settings' },
                { id: 'pengaturan-bri-qris', label: 'Pengaturan BRI & QRIS', icon: 'credit-card' },
                { id: 'audit-log', label: 'Riwayat Audit Trail', icon: 'history' }
            ];
            const viewerMenus = [
                { id: 'dashboard', label: 'Dashboard Pemantauan', icon: 'layout-dashboard' },
                { id: 'master-st', label: 'Rekap Surat Tugas', icon: 'file-text' },
                { id: 'buku-kas', label: 'Arus Kas Digital', icon: 'book-open' },
                { id: 'laporan', label: 'Laporan Publik', icon: 'bar-chart-3' }
            ];
            const activeMenus = isAdmin ? adminMenus : viewerMenus;

            return `
                <aside id="app-sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-navy-900 text-slate-300 flex flex-col flex-shrink-0 border-r border-navy-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
                    <div class="p-4 border-b border-navy-800 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-gold-500/20 text-gold-400 rounded-lg"><i data-lucide="wallet" class="w-6 h-6"></i></div>
                            <div>
                                <h2 class="font-bold text-white text-sm tracking-wide">KAS-ST</h2>
                                <p class="text-[10px] text-slate-400 uppercase">Database Sheet Sync</p>
                            </div>
                        </div>
                        <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">
                        ${activeMenus.map(m => `
                            <button onclick="switchView('${m.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium transition ${state.activeView === m.id ? 'bg-gold-500 text-slate-950 font-bold shadow' : 'hover:bg-navy-800 hover:text-white text-slate-300'}">
                                <i data-lucide="${m.icon}" class="w-4 h-4"></i>
                                <span>${m.label}</span>
                            </button>
                        `).join('')}
                    </nav>
                    <div class="p-3 border-t border-navy-800">
                        <div class="p-2.5 bg-navy-800/60 rounded-lg flex items-center justify-between text-xs">
                            <div class="truncate mr-2">
                                <p class="font-semibold text-white truncate">${state.currentUser.name}</p>
                                <p class="text-[10px] text-gold-400 uppercase font-mono">${state.currentUser.role}</p>
                            </div>
                            <button onclick="handleLogout()" title="Logout" class="p-1.5 hover:bg-navy-700 text-slate-400 hover:text-white rounded-md transition"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </aside>
            `;
        }

        function switchView(viewId) {
            state.activeView = viewId;
            if (window.innerWidth < 1024) toggleSidebar();
            renderApp();
        }

        function renderNavbar() {
            return `
                <header class="bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition"><i data-lucide="menu" class="w-5 h-5"></i></button>
                        <div>
                            <h1 class="text-sm md:text-base font-bold text-slate-800 truncate">${getViewTitle(state.activeView)}</h1>
                            <p class="text-[10px] md:text-[11px] text-slate-500 hidden sm:block">Sinkronisasi Otomatis Google Spreadsheet</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 text-xs">
                        <div class="px-2.5 py-1 bg-emerald-50 rounded-full border border-emerald-200 text-emerald-700 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="font-medium text-[11px]">Database Terhubung</span>
                        </div>
                    </div>
                </header>
            `;
        }

        function getViewTitle(view) {
            const titles = {
                'dashboard': 'Dashboard UTAMA Kas Surat Tugas',
                'master-st': 'Master Data Surat Tugas (ST)',
                'master-pegawai': 'Kelola Master Data Pegawai / Pelaksana',
                'penerimaan': 'Pencatatan Penerimaan Kas',
                'pengeluaran': 'Pencatatan Pengeluaran Kas',
                'buku-kas': 'Buku Kas & Arus Kas Digital',
                'rekonsiliasi': 'Rekonsiliasi Kas & Bank',
                'laporan': 'Laporan Keuangan & Cetak',
                'pengaturan-tarif': 'Pengaturan Tarif Dasar ST',
                'pengaturan-bri-qris': 'Pengaturan Metode Pembayaran',
                'audit-log': 'Riwayat Aktivitas & Audit Trail'
            };
            return titles[view] || 'Kas Surat Tugas';
        }

        function renderMainView() {
            switch (state.activeView) {
                case 'dashboard': return renderDashboardView();
                case 'master-st': return renderMasterSTView();
                case 'master-pegawai': return renderMasterPegawaiView();
                case 'penerimaan': return renderPenerimaanView();
                case 'pengeluaran': return renderPengeluaranView();
                case 'buku-kas': return renderBukuKasView();
                case 'rekonsiliasi': return renderRekonsiliasiView();
                case 'laporan': return renderLaporanView();
                case 'pengaturan-tarif': return renderPengaturanTarifView();
                case 'pengaturan-bri-qris': return renderPengaturanPaymentView();
                case 'audit-log': return renderAuditLogView();
                default: return renderDashboardView();
            }
        }

        function updateCalculatedTarif() {
            const jenis = document.getElementById('st-jenis')?.value;
            const previewEl = document.getElementById('st-alokasi-preview');
            if (!previewEl) return;
            const nominal = jenis === 'Luar Kota' ? state.settings.tarifLuarKota : state.settings.tarifDalamKota;
            previewEl.value = formatRupiah(nominal);
        }

        // SAVE ST DENGAN SINKRONISASI KE GOOGLE SHEETS
        function handleSaveST(e) {
            e.preventDefault();
            const nomor = document.getElementById('st-nomor').value.trim();
            const pelaksana = document.getElementById('st-pelaksana').value;
            const tanggal = document.getElementById('st-tanggal').value;
            const pelaksanaan = document.getElementById('st-pelaksanaan').value;
            const uraian = document.getElementById('st-uraian').value;
            const jenis = document.getElementById('st-jenis').value;
            const metode = document.getElementById('st-metode').value;
            const ref = document.getElementById('st-ref').value || `REF-${Math.floor(10000 + Math.random() * 90000)}`;

            const tarifNominal = jenis === 'Luar Kota' ? state.settings.tarifLuarKota : state.settings.tarifDalamKota;

            const newST = {
                id: `ST-2026-${String(state.suratTugas.length + 1).padStart(3, '0')}`,
                nomor, pelaksana, tanggal, pelaksanaan, uraian, jenis,
                tarif: tarifNominal, alokasi: tarifNominal, metode, ref,
                status: "Menunggu Verifikasi Admin", lampiran: null
            };

            state.suratTugas.unshift(newST);

            state.transactions.unshift({
                id: `TRX-${String(state.transactions.length + 1).padStart(3, '0')}`,
                tanggal: tanggal, stNomor: nomor, jenis: "Penerimaan",
                kategori: `Alokasi ST ${jenis}`, uraian: `Pencairan Kas ${nomor} (${pelaksana})`,
                masuk: tarifNominal, keluar: 0, metode, ref,
                status: "Menunggu Verifikasi", pencatat: state.currentUser.name, validator: "-"
            });

            // Kirim data ke Google Spreadsheet Apps Script
            syncToGoogleSheets({
                nomor_st: nomor,
                nama_pelaksana: pelaksana,
                tanggal_st: tanggal,
                uraian_kegiatan: uraian,

        function prosesPembayaranST(stId) {
            const st = state.suratTugas.find(s => s.id === stId);
            if (!st) return;
            st.status = "Sudah Dibayar";
            const tx = state.transactions.find(t => t.stNomor === st.nomor);
            if (tx) { tx.status = "Sah"; tx.validator = state.currentUser.name; }
            logAudit("Verifikasi Pembayaran ST", `Mengesahkan pembayaran ST ${st.nomor}`);
            saveState();
        }

        function verifikasiTransaksi(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;
            tx.status = "Sah";
            tx.validator = state.currentUser.name;
            if (tx.stNomor && tx.stNomor !== '-') {
                const st = state.suratTugas.find(s => s.nomor === tx.stNomor);
                if (st) st.status = "Sudah Dibayar";
            }
            logAudit("Sahkan Transaksi", `Mengesahkan transaksi ${tx.id}`);
            saveState();
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
